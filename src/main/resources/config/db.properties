# GAPE - Configuracao JDBC
# Nao colocar credenciais reais no codigo Java.
# Este ficheiro e lido por pt.isel.gape.common.config.DatabaseConfig.

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/gape?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.user=root
db.password=root

# Bootstrap simples da base de dados ao arrancar a aplicacao web.
# Modos:
# - none   -> nao altera a base de dados
# - schema -> recria o schema sem dados
# - demo   -> recria o schema com o seed base
# - full   -> recria o schema com o seed base e com o seed adicional
#
# Nota: qualquer modo diferente de 'none' recria a base de dados em cada arranque.
# Depois de carregar os dados pretendidos, volta a colocar 'none' se quiseres preservar alteracoes manuais.
db.bootstrap.mode=full

# Pasta base para ficheiros carregados por utilizadores.
# Em desenvolvimento, aponta para a pasta uploads na raiz do projeto.
# Em producao, substituir por um caminho absoluto, por exemplo C:\gape\uploads ou /var/gape/uploads.
gape.upload.dir=uploads

# Processamento de conteudos carregados.
# true impede guardar ficheiros originais quando a normalizacao/compressao falha.
gape.content.processing.strict=true
gape.content.media.processing.strict=true

# Opcional: caminho absoluto para um processador de audio/video especifico.
# Vazio usa o processador nativo empacotado com a aplicacao.
gape.media.processor.executable=
