# GAPE - JDBC configuration
# Do not place real credentials in Java code.
# This file is read by pt.isel.gape.common.config.DatabaseConfig.

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/gape?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL&forceConnectionTimeZoneToSession=false&preserveInstants=false
db.user=root
db.password=root

# Bounded JDBC pool. Environment overrides use GAPE_DB_POOL_*.
db.pool.maximumSize=12
db.pool.minimumIdle=1
db.pool.connectionTimeoutMs=10000
db.pool.validationTimeoutMs=5000
db.pool.idleTimeoutMs=600000
db.pool.maxLifetimeMs=1800000

# Application logging (SLF4J Simple).
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=dd-MM-yyyy HH-mm-ss
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# Simple database bootstrap when the web application starts.
# Modes:
# - none   -> does not alter the database
# - schema -> recreates the schema without data
# - demo   -> recreates the schema with the base seed
# - full   -> recreates the schema with the base seed and the additional seed
#
# Note: any mode other than 'none' recreates the database on each startup.
# After loading the intended data, set this back to 'none' to preserve manual changes.
db.bootstrap.mode=full


# Base folder for files uploaded by users.
# In development, this points to the uploads folder in the project root.
# In production, replace it with an absolute path, for example C:\gape\uploads or /var/gape/uploads.
gape.upload.dir=uploads

# Uploaded content processing.
# true prevents original files from being stored when normalization/compression fails.
gape.content.processing.strict=true
gape.content.media.processing.strict=true

# Optional: absolute path to a specific audio/video processor.
# Empty uses the native processor packaged with the application.
gape.media.processor.executable=
